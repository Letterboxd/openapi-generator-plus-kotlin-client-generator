name: Node CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20.x
          - 22.x
          - 24.x
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Check out test specs
        uses: actions/checkout@v4
        with:
          repository: 'karlvr/openapi-generator-plus-generators'
          path: 'test-input'
      # https://pnpm.io/continuous-integration
      - uses: pnpm/action-setup@v4
      # Build and lint with the Node version that the development tools need
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      # The tests build the generated Kotlin with Gradle
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - name: Use Node.js ${{ matrix.node-version }} for test
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm test
