openapi: 3.0.3
info:
  title: Request builders
  version: 1.0.0
security:
  - token: []
paths:
  /things:
    get:
      operationId: getThings
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: perPage
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The things
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
components:
  securitySchemes:
    token:
      type: apiKey
      in: header
      name: X-Token
