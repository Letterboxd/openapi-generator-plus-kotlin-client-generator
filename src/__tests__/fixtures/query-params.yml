openapi: 3.0.0
info:
  title: Query params test
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/Status'
        - name: X-Token
          in: header
          schema:
            type: string
      responses:
        '200':
          description: ok
components:
  schemas:
    Status:
      type: string
      enum:
        - available
        - pending
        - sold
